name: Build and publish docker image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: alpine
            tag-suffix: ''
          - distro: alpine
            tag-suffix: roadrunner
          - distro: alpine
            tag-suffix: alpine
          - distro: alpine
            tag-suffix: roadrunner-alpine
          - distro: debian
            tag-suffix: debian
          - distro: debian
            tag-suffix: roadrunner-debian
    uses: shlinkio/github-actions/.github/workflows/docker-publish-image.yml@main
    secrets: inherit
    with:
      image-name: shlinkio/shlink
      dockerfile: docker/${{ matrix.distro }}/Dockerfile
      version-arg-name: SHLINK_VERSION
      platforms: 'linux/arm64/v8,linux/amd64'
      tags-suffix: ${{ matrix.tag-suffix }}
      extra-build-args: |
        SHLINK_RUNTIME=rr
